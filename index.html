<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14283f">
<title>議題卡片</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="議題卡片">
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#1d232b; --sub:#55657a; --navy:#14283f; --line:#d5dbe3;
  --gold:#c58a1b; --goldbg:#f9eeda; --green:#24512a; --greenbg:#e5f0e4; --blue:#1f3d63; --bluebg:#dfe8f3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141b; --card:#1a222d; --ink:#e7ecf2; --sub:#9aa8b8; --navy:#9cc0ea; --line:#2c3846;
    --goldbg:#3a2f1a; --greenbg:#1d3320; --bluebg:#1d2c40; --green:#9fd3a6; --blue:#a9c8ee; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* 解鎖畫面 */
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.lockbox h1{margin:0 0 6px;font-size:22px;color:var(--navy)}
.lockbox p{margin:0 0 18px;color:var(--sub);font-size:14px}
.lockbox input{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lockbox button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#14283f;color:#fff;font-size:16px;font-weight:700}
#lockmsg{min-height:20px;margin-top:10px;font-size:14px;color:#c0392b}

/* 主畫面 */
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:var(--bg);position:sticky;top:0;z-index:5}
.toprow{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:14px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:#14283f;color:#fff;border-color:#14283f}
.progress{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}

main{flex:1;overflow-y:auto;padding:6px 12px 12px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:18px 16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line);animation:in .18s ease}
.card.pri{border:2px solid var(--gold)}
@keyframes in{from{opacity:.3;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px}
.no{font-weight:800;color:var(--navy);font-size:15px}
.tag{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.tag.p{background:var(--bluebg);color:var(--blue)}
.tag.i{background:var(--greenbg);color:var(--green)}
.tag.s{background:var(--gold);color:#fff}
.tag.r{background:var(--line);color:var(--ink)}
.star{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--sub);padding:0 2px}
.star.on{color:var(--gold)}
.topic{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.q{font-size:18.5px;line-height:1.6;font-weight:700;margin:0 0 14px}
.sec{border-top:1px solid var(--line);padding:11px 0 2px}
.sec h4{margin:0 0 4px;font-size:13px;color:var(--gold);letter-spacing:.5px}
.sec div{font-size:16px;line-height:1.7}
.sec.us div{color:var(--ink);font-weight:500}
.reveal{width:100%;padding:14px;border-radius:12px;border:1px dashed var(--gold);background:var(--goldbg);font-size:16px;font-weight:700;margin-top:4px}
.note{background:var(--goldbg);border-radius:12px;padding:14px;font-size:16px;line-height:1.75}

footer{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
footer button{flex:1;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700}
footer button.next{background:#14283f;color:#fff;border-color:#14283f;flex:1.6}
footer .count{flex:0 0 auto;align-self:center;font-size:14px;color:var(--sub);min-width:62px;text-align:center}

/* 目錄 */
#toc{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.tocbox{background:var(--card);width:100%;max-width:680px;max-height:80%;border-radius:16px 16px 0 0;overflow-y:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.tocbox h3{margin:4px 4px 10px;font-size:16px}
.tocitem{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px 6px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.tocitem b{flex:0 0 52px;color:var(--navy)}
.tocitem.cur{background:var(--goldbg)}
.empty{padding:30px 10px;text-align:center;color:var(--sub)}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <h1>議題卡片</h1>
    <p>請輸入密碼</p>
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="密碼">
    <button id="unlock">解鎖</button>
    <div id="lockmsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="toprow">
      <select id="topic"></select>
      <button class="iconbtn" id="tocbtn">目錄</button>
      <button class="iconbtn" id="lockbtn" title="鎖定">鎖定</button>
    </div>
    <div class="chips">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="pri">只看優先</button>
      <button class="chip" data-f="q">只看提問</button>
      <button class="chip" data-f="r">只看反問</button>
      <button class="chip" data-f="star">已標記</button>
      <button class="chip" id="hidebtn">遮住擬答</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </header>
  <main id="main"></main>
  <footer>
    <button id="prev">上一題</button>
    <span class="count" id="count"></span>
    <button class="next" id="next">下一題</button>
  </footer>
</div>

<div id="toc" class="hidden"><div class="tocbox" id="tocbox"></div></div>

let DATA = null, deck = [], idx = 0, topicSel = "all", filter = "all", hideAns = false, revealed = false;
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let stars = new Set(store.get("cards_stars", []));

function b64(s){ const b = atob(s); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function decrypt(pw){
  const p = JSON.parse(atob(PAYLOAD));
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryUnlock(){
  const pw = $("#pw").value.trim();
  if(!pw){ $("#lockmsg").textContent = "請輸入密碼"; return; }
  if(!window.crypto || !crypto.subtle){ $("#lockmsg").textContent = "此瀏覽器不支援解密，請用 https 網址開啟"; return; }
  $("#lockmsg").textContent = "解鎖中…";
  try{
    DATA = await decrypt(pw);
    $("#pw").value = "";
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
    init();
  }catch(e){ $("#lockmsg").textContent = "密碼錯誤"; }
}
$("#unlock").onclick = tryUnlock;
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });
$("#lockbtn").onclick = () => { DATA = null; deck = []; $("#main").innerHTML = ""; $("#app").classList.add("hidden"); $("#lock").classList.remove("hidden"); $("#lockmsg").textContent = ""; };

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function init(){
  const sel = $("#topic");
  sel.innerHTML = '<option value="all">全部題目</option>' + DATA.topics.map((t,i) => `<option value="${i}">${"一二三四五"[i]}、${esc(t.title)}</option>`).join("");
  const saved = store.get("cards_pos", null);
  if(saved){ topicSel = saved.t; filter = saved.f || "all"; }
  sel.value = topicSel;
  document.querySelectorAll(".chip[data-f]").forEach(c => c.classList.toggle("on", c.dataset.f === filter));
  build();
  if(saved && saved.id){ const k = deck.findIndex(c => c.id === saved.id); if(k >= 0) idx = k; }
  render(0);
}
function build(){
  deck = [];
  DATA.topics.forEach((t, ti) => {
    if(topicSel !== "all" && String(ti) !== String(topicSel)) return;
    const showNote = filter === "all";
    if(showNote) deck.push({type:"N", id:`N${ti+1}`, ti, title:t.title, note:t.note});
    t.cards.forEach(c => {
      const ok = filter === "all" || (filter === "pri" && c.pri) || (filter === "q" && c.type === "Q") ||
                 (filter === "r" && c.type === "R") || (filter === "star" && stars.has(c.id));
      if(ok) deck.push(Object.assign({ti, title:t.title}, c));
    });
  });
  idx = 0;
}
function render(dir){
  const m = $("#main");
  revealed = false;
  if(!deck.length){ m.innerHTML = '<div class="empty">此條件下沒有卡片</div>'; $("#count").textContent = "0／0"; $("#bar").style.width = "0"; return; }
  const c = deck[idx];
  let h = "";
  if(c.type === "N"){
    h = `<div class="card" style="--dx:${dir*30}px"><div class="meta"><span class="no">${"一二三四五"[c.ti]}</span><span class="tag r">本題重點</span></div>
      <p class="q">${esc(c.title)}</p><div class="note">${esc(c.note)}</div></div>`;
  }else{
    const star = `<button class="star ${stars.has(c.id) ? "on" : ""}" id="starbtn" aria-label="標記">★</button>`;
    let tags = "";
    if(c.type === "Q") tags = (c.view === "政策" ? '<span class="tag p">政策</span>' : '<span class="tag i">情報</span>') + (c.pri ? '<span class="tag s">優先</span>' : "");
    else tags = '<span class="tag r">對方反問</span>';
    let body;
    if(c.type === "Q"){
      body = `<div class="sec"><h4>預判對方回應</h4><div>${esc(c.jp)}</div></div>
        <div class="sec us"><h4>我方接續擬答</h4><div>${esc(c.ours)}</div></div>
        <div class="sec"><h4>提問目的</h4><div>${esc(c.pur)}</div></div>
        <div class="sec"><h4>對我方助益</h4><div>${esc(c.ben)}</div></div>`;
    }else{
      body = `<div class="sec us"><h4>擬答</h4><div>${esc(c.a)}</div></div>
        <div class="sec"><h4>界線</h4><div>${esc(c.lim)}</div></div>`;
    }
    const ans = hideAns ? `<button class="reveal" id="revealbtn">顯示擬答</button><div id="ans" class="hidden">${body}</div>` : body;
    h = `<div class="card ${c.pri ? "pri" : ""}" style="--dx:${dir*30}px"><div class="meta"><span class="no">${c.no}</span>${tags}${star}</div>
      <div class="topic">${"一二三四五"[c.ti]}、${esc(c.title)}</div><p class="q">${esc(c.q)}</p>${ans}</div>`;
  }
  m.innerHTML = h; m.scrollTop = 0;
  const sb = $("#starbtn");
  if(sb) sb.onclick = () => { stars.has(c.id) ? stars.delete(c.id) : stars.add(c.id); store.set("cards_stars", [...stars]); sb.classList.toggle("on"); };
  const rb = $("#revealbtn");
  if(rb) rb.onclick = reveal;
  $("#count").textContent = `${idx+1}／${deck.length}`;
  $("#bar").style.width = `${(idx+1)/deck.length*100}%`;
  $("#prev").disabled = idx === 0; $("#prev").style.opacity = idx === 0 ? .45 : 1;
  $("#next").textContent = idx === deck.length - 1 ? "回到第一張" : "下一題";
  store.set("cards_pos", {t:topicSel, f:filter, id:c.id});
}
function reveal(){ const a = $("#ans"); if(a){ a.classList.remove("hidden"); $("#revealbtn").remove(); revealed = true; } }
function go(d){
  if(!deck.length) return;
  idx = d > 0 ? (idx + 1) % deck.length : Math.max(0, idx - 1);
  render(d);
}
$("#next").onclick = () => go(1);
$("#prev").onclick = () => go(-1);
$("#topic").onchange = e => { topicSel = e.target.value; build(); render(0); };
document.querySelectorAll(".chip[data-f]").forEach(ch => ch.onclick = () => {
  filter = ch.dataset.f;
  document.querySelectorAll(".chip[data-f]").forEach(c => c.classList.toggle("on", c === ch));
  build(); render(0);
});
$("#hidebtn").onclick = () => { hideAns = !hideAns; $("#hidebtn").classList.toggle("on", hideAns); render(0); };
document.addEventListener("keydown", e => {
  if($("#app").classList.contains("hidden") || !$("#toc").classList.contains("hidden")) return;
  if(e.key === "ArrowRight") go(1);
  else if(e.key === "ArrowLeft") go(-1);
  else if(e.key === " "){ e.preventDefault(); if(hideAns && !revealed) reveal(); else go(1); }
});
let sx = 0, sy = 0;
$("#main").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("#main").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, {passive:true});
$("#tocbtn").onclick = () => {
  const box = $("#tocbox");
  box.innerHTML = `<h3>目錄（${deck.length} 張）</h3>` + deck.map((c, i) =>
    `<button class="tocitem ${i === idx ? "cur" : ""}" data-i="${i}"><b>${c.type === "N" ? "重點" : c.no}</b><span>${esc(c.type === "N" ? c.title : c.q)}</span></button>`).join("");
  $("#toc").classList.remove("hidden");
  const cur = box.querySelector(".cur"); if(cur) cur.scrollIntoView({block:"center"});
  box.querySelectorAll(".tocitem").forEach(b => b.onclick = () => { idx = +b.dataset.i; $("#toc").classList.add("hidden"); render(0); });
};
$("#toc").onclick = e => { if(e.target.id === "toc") $("#toc").classList.add("hidden"); };
if("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
</html>
