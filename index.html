<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light only">
<title>議題卡片</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="議題卡片">
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#f2f2f7; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --tint:#007aff; --orange:#ff9500; --green:#34c759;
  --hl:rgba(255,204,0,.28); --bar:rgba(249,249,249,.82); --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}
.press{transition:transform .12s, opacity .12s}.press:active{transform:scale(.97);opacity:.75}

/* ===== 解鎖 ===== */
#lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.appicon{width:76px;height:76px;border-radius:18px;background:url(icon-192.png) center/cover,#14283f;box-shadow:0 4px 16px rgba(0,0,0,.15);margin-bottom:18px}
#lock h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:.3px}
#lock .sub{color:var(--label2);font-size:15px;margin:0 0 26px}
.field{width:100%;max-width:340px;display:flex;background:var(--bg2);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font-size:17px;padding:14px 16px;outline:none}
.field button{color:var(--tint);font-size:17px;font-weight:600;padding:0 18px}
#lockmsg{min-height:22px;margin-top:12px;font-size:14px;color:#ff3b30;text-align:center}
#lockver{margin-top:28px;font-size:13px;color:var(--label3)}

/* ===== 版面 ===== */
#app{height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
.navbar{position:sticky;top:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px;border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:30px;position:relative}
.navbtn{color:var(--tint);font-size:17px;padding:4px 0}
.navtitle{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s;white-space:nowrap;max-width:56%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.navbar.scrolled .navtitle{opacity:1}
.large{font-size:34px;font-weight:700;letter-spacing:.2px;margin:6px 0 10px;line-height:1.2}

/* 分段控制 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 2px;border-radius:7px;color:var(--label);white-space:nowrap}
.seg button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;font-size:14px;padding:6px 13px;border-radius:999px;background:var(--fill);color:var(--label)}
.pill.on{background:var(--tint);color:#fff}

/* ===== 卡片 ===== */
.progress{height:3px;border-radius:2px;background:var(--fill);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--tint);transition:width .25s ease}
.card{background:var(--bg2);border-radius:20px;padding:20px 18px 18px;margin:14px 0 12px;box-shadow:var(--shadow);animation:cin .22s ease}
@keyframes cin{from{opacity:0;transform:translateX(var(--dx,0px))}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cno{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill);color:var(--label2)}
.badge.pri{background:rgba(255,149,0,.16);color:var(--orange)}
.badge.p{background:rgba(0,122,255,.12);color:var(--tint)}
.badge.i{background:rgba(52,199,89,.15);color:var(--green)}
.starbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label3)}
.starbtn.on{color:var(--orange)}
.starbtn svg{width:22px;height:22px}
.ctopic{font-size:13px;color:var(--label2);margin-bottom:8px}
.cq{font-size:20px;line-height:1.55;font-weight:600;margin:0 0 6px;letter-spacing:.1px}
.sec{padding:14px 0 0;margin-top:14px;border-top:.5px solid var(--sep)}
.sec h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.3px}
.sec p{margin:0;font-size:16.5px;line-height:1.72}
.sec.us p{font-weight:500}
.reveal{display:block;width:100%;margin-top:16px;padding:14px;border-radius:12px;background:var(--fill);color:var(--tint);font-size:16px;font-weight:600}
.notebox{background:var(--hl);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.75;margin-top:8px}
.ctrl{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 0 12px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 30%)}
.ctrl button{flex:1;height:50px;border-radius:14px;font-size:17px;font-weight:600}
.ctrl .prev{background:var(--bg2);color:var(--tint);box-shadow:var(--shadow)}
.ctrl .next{background:var(--tint);color:#fff;flex:1.5}
.ctrl .count{flex:0 0 auto;font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.ctrl button:disabled{opacity:.35}
.empty{text-align:center;color:var(--label2);padding:60px 20px;font-size:15px;line-height:1.6}

/* ===== 分組列表 ===== */
.gtitle{font-size:13px;color:var(--label2);margin:22px 16px 7px;letter-spacing:.3px}
.group{background:var(--bg2);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:48px;position:relative;font-size:16.5px}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
.cell .ic{flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.cell .tx{flex:1;min-width:0;line-height:1.4}
.cell .tx small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
.cell .val{color:var(--label2);font-size:16px}
.cell .chev{color:var(--label3);font-size:22px;line-height:1}
.cell.danger{color:#ff3b30;justify-content:center}
.cell.link{color:var(--tint)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}.switch.on::after{transform:translateX(20px)}
.foot{font-size:13px;color:var(--label2);margin:8px 16px 24px;line-height:1.5}

/* ===== 背景文章 ===== */
.article{background:var(--bg2);border-radius:16px;padding:4px 18px 16px;margin-top:12px;font-size:16.5px;line-height:1.75}
.article h3{font-size:19px;font-weight:700;margin:20px 0 8px}
.article h2{font-size:20px;margin:18px 0 8px}
.article ul,.article ol{padding-left:22px;margin:6px 0}
.article li{margin:6px 0}
.article p{margin:8px 0}
.article .hl{background:var(--hl);border-radius:4px;padding:0 2px;font-weight:600}
.article td.hl{border-radius:0}
.tblwrap{overflow-x:auto;margin:10px -6px;padding:0 6px}
.article table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;line-height:1.55;border:.5px solid var(--sep);border-radius:12px;overflow:hidden}
.article th{background:var(--bg3);font-weight:600;text-align:left;padding:9px 10px;font-size:13px;color:var(--label2)}
.article td{padding:9px 10px;vertical-align:top;border-top:.5px solid var(--sep)}
.article td + td,.article th + th{border-left:.5px solid var(--sep)}
.article th[style]{width:auto!important}
.article td:first-child{min-width:5.5em}
.keybox{background:var(--hl);border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.75;margin-top:12px}
.keybox b{display:block;font-size:13px;color:var(--label2);margin-bottom:4px;letter-spacing:.3px}
.srcs a{display:block;padding:11px 16px;font-size:14.5px;line-height:1.45;color:var(--label);text-decoration:none;position:relative}
.srcs a + a::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.srcs a small{display:block;color:var(--tint);font-size:12px;margin-top:2px;word-break:break-all}
.gloss td:nth-child(2){white-space:nowrap}

/* ===== 底部分頁列 ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:700px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:#999;font-size:10.5px;font-weight:500}

.tab svg{width:26px;height:26px}
.tab.on{color:var(--tint)}

/* ===== 底部面板 ===== */
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:700px;max-height:86%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheethd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
.sheethd b{font-size:17px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 0}
.sheetbd{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.tocrow{display:flex;gap:10px;width:100%;text-align:left;padding:11px 16px;font-size:15px;line-height:1.45;position:relative}
.tocrow + .tocrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.tocrow b{flex:0 0 46px;font-variant-numeric:tabular-nums;color:var(--label2);font-weight:600}
.tocrow.cur{background:rgba(0,122,255,.1)}
.hist{padding:12px 16px;position:relative}
.hist + .hist::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.hist .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.hist .h span{font-weight:400;font-size:13px;color:var(--label2)}
.hist .h em{font-style:normal;font-size:11px;background:var(--tint);color:#fff;border-radius:5px;padding:1px 6px}
.hist ul{margin:6px 0 0;padding-left:20px;font-size:14.5px;line-height:1.6;color:var(--label2)}

/* ===== 提示 ===== */
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(30,30,30,.92);color:#fff;
  font-size:14.5px;padding:10px 16px;border-radius:12px;max-width:86%;text-align:center;transition:opacity .25s;pointer-events:none}
#updbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:50;max-width:676px;margin:0 auto;background:var(--bg2);
  border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:up .3s}
#updbar .t{flex:1;font-size:14px;line-height:1.4;color:var(--label2)}
#updbar .t b{display:block;font-size:15px;color:var(--label)}
#updbar button{background:var(--tint);color:#fff;border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:600}
body.locked #updbar{bottom:calc(16px + env(safe-area-inset-bottom))}
</style>
</head>
<body class="locked">

<div id="lock">
  <div class="appicon"></div>
  <h1>議題卡片</h1>
  <p class="sub">請輸入密碼以解鎖內容</p>
  <div class="field">
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="密碼" enterkeyhint="go">
    <button id="unlock">解鎖</button>
  </div>
  <div id="lockmsg"></div>
  <div id="lockver"></div>
</div>

<div id="app" class="hidden">
  <section class="view" id="v-cards">
    <div class="navbar"><div class="wrap">
      <div class="navrow">
        <button class="navbtn press" id="tocbtn">目錄</button>
        <span class="navtitle">提問</span>
        <button class="navbtn press" id="hidebtn">遮住擬答</button>
      </div>
      <div class="large">提問</div>
      <div class="seg" id="filters">
        <button data-f="all" class="on">全部</button><button data-f="pri">優先</button><button data-f="q">提問</button><button data-f="r">反問</button><button data-f="star">標記</button>
      </div>
      <div class="pills" id="topics"></div>
      <div class="progress"><i id="bar"></i></div>
    </div></div>
    <div class="wrap">
      <div id="cardhost"></div>
      <div class="ctrl">
        <button class="prev press" id="prev">上一題</button>
        <span class="count" id="count"></span>
        <button class="next press" id="next">下一題</button>
      </div>
    </div>
  </section>

  <section class="view hidden" id="v-bg">
    <div class="navbar"><div class="wrap">
      <div class="navrow">
        <button class="navbtn press" id="bgback" style="visibility:hidden">‹ 背景</button>
        <span class="navtitle" id="bgnavtitle">背景</span><span></span>
      </div>
      <div class="large" id="bgtitle">背景</div>
    </div></div>
    <div class="wrap" id="bghost"></div>
  </section>

  <section class="view hidden" id="v-set">
    <div class="navbar"><div class="wrap">
      <div class="navrow"><span>&nbsp;</span><span class="navtitle">設定</span><span></span></div>
      <div class="large">設定</div>
    </div></div>
    <div class="wrap" id="sethost"></div>
  </section>

  <nav class="tabbar"><div class="in">
    <button class="tab on" data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10a2.5 2.5 0 0 1 2.5 2.5V17"/></svg>提問</button>
    <button class="tab" data-v="bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 7.8 4.3 4 4.5v14c3.8-.2 6.3.5 8 2 1.7-1.5 4.2-2.2 8-2v-14c-3.8-.2-6.3.5-8 2z"/><path d="M12 6.5v14"/></svg>背景</button>
    <button class="tab" data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </div></nav>
</div>

<div id="updbar" class="hidden"><div class="t"><b id="updtitle"></b><span id="updtxt"></span></div><button id="updbtn" class="press">更新</button></div>
<div id="toast" style="opacity:0"></div>

/* ===== 解密 ===== */
function b64(s){ const b = atob(s); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function decrypt(pw){
  const p = JSON.parse(atob(PAYLOAD)), enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.ct))));
}
async function tryUnlock(){
  const pw = $("#pw").value.trim(), m = $("#lockmsg");
  if(!pw){ m.textContent = "請輸入密碼"; return; }
  if(!window.crypto || !crypto.subtle){ m.textContent = "此瀏覽器不支援解密，請用 https 網址開啟"; return; }
  m.style.color = "var(--label2)"; m.textContent = "解鎖中…";
  try{
    DATA = await decrypt(pw);
    $("#pw").value = ""; $("#pw").blur(); m.textContent = ""; m.style.color = "";
    $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden"); document.body.classList.remove("locked");
    init();
  }catch(e){
    m.style.color = ""; m.textContent = "密碼錯誤"; haptic();
    $(".field").animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:280});
  }
}
$("#unlock").onclick = tryUnlock;
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });

}

let curView = "cards";

  curView = v;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  ["cards","bg","set"].forEach(k => $("#v-" + k).classList.toggle("hidden", k !== v));
  if(v === "set") renderSettings();
  if(v === "bg" && !$("#bghost").innerHTML) renderBgList();
  store.set("cards_view", v);
}

  showView(t.dataset.v);
});

  syncTopicPills(); syncFilters(); syncHideBtn();
  build();
  if(saved && saved.id){ const k = deck.findIndex(c => c.id === saved.id); if(k >= 0) idx = k; }
  render(0);
  bgOpen = null; $("#bghost").innerHTML = "";
  showView(store.get("cards_view", "cards"));
}
function syncTopicPills(){ document.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.dataset.t === String(topicSel))); const on = $(".pill.on"); if(on) on.scrollIntoView({inline:"center", block:"nearest"}); }
function syncFilters(){ document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.f === filter)); }
function syncHideBtn(){ $("#hidebtn").textContent = hideAns ? "顯示擬答" : "遮住擬答"; }
document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; syncFilters(); build(); render(0); });
$("#hidebtn").onclick = () => { hideAns = !hideAns; store.set("cards_hide", hideAns); syncHideBtn(); render(0); };

/* ===== 卡片 ===== */
function build(){
  deck = [];
  DATA.topics.forEach((t, ti) => {
    if(topicSel !== "all" && String(ti) !== String(topicSel)) return;
    if(filter === "all") deck.push({type:"N", id:`N${ti+1}`, ti, title:t.title, note:t.note});
    t.cards.forEach(c => {
      const ok = filter === "all" || (filter === "pri" && c.pri) || (filter === "q" && c.type === "Q") || (filter === "r" && c.type === "R") || (filter === "star" && stars.has(c.id));
      if(ok) deck.push(Object.assign({ti, title:t.title}, c));
    });
  });
  idx = 0;
}
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const STARO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
function sec(h, t, us){ return `<div class="sec${us ? " us" : ""}"><h4>${h}</h4><p>${esc(t)}</p></div>`; }
function render(dir){
  const host = $("#cardhost");
  if(!deck.length){
    host.innerHTML = `<div class="empty">${filter === "star" ? "還沒有標記的提問<br>點右上角的星號即可標記" : "此條件下沒有提問"}</div>`;
    $("#count").textContent = "0／0"; $("#bar").style.width = "0"; $("#prev").disabled = $("#next").disabled = true; return;
  }
  $("#next").disabled = false;
  const c = deck[idx];
  let h;
  if(c.type === "N"){
    h = `<div class="card" style="--dx:${dir*24}px"><div class="cmeta"><span class="badge">${CN[c.ti]}・本題重點</span></div>
      <p class="cq">${esc(c.title)}</p><div class="notebox">${esc(c.note)}</div></div>`;
  }else{
    const tags = c.type === "Q" ? `<span class="badge ${c.view === "政策" ? "p" : "i"}">${c.view}</span>${c.pri ? '<span class="badge pri">優先</span>' : ""}` : '<span class="badge">對方反問</span>';
    const body = c.type === "Q" ? sec("預判對方回應", c.jp) + sec("我方接續擬答", c.ours, 1) + sec("提問目的", c.pur) + sec("對我方助益", c.ben)
                                : sec("擬答", c.a, 1) + sec("界線", c.lim);
    const on = stars.has(c.id);
    h = `<div class="card" style="--dx:${dir*24}px"><div class="cmeta"><span class="cno">${c.no}</span>${tags}<button class="starbtn press${on ? " on" : ""}" id="starbtn" aria-label="標記">${on ? STAR : STARO}</button></div>
      <div class="ctopic">${CN[c.ti]}・${esc(c.title)}</div><p class="cq">${esc(c.q)}</p>
      ${hideAns ? `<button class="reveal press" id="revealbtn">顯示擬答</button><div id="ans" class="hidden">${body}</div>` : body}</div>`;
  }
  host.innerHTML = h;
  $("#v-cards").scrollTo({top:0});
  const sb = $("#starbtn");
  if(sb) sb.onclick = () => { haptic(); const on = !stars.has(c.id); on ? stars.add(c.id) : stars.delete(c.id); store.set("cards_stars", [...stars]); sb.classList.toggle("on", on); sb.innerHTML = on ? STAR : STARO; toast(on ? "已標記" : "已取消標記"); };
  const rb = $("#revealbtn"); if(rb) rb.onclick = reveal;
  $("#count").textContent = `${idx+1}／${deck.length}`;
  $("#bar").style.width = `${(idx+1)/deck.length*100}%`;
  $("#prev").disabled = idx === 0;
  $("#next").textContent = idx === deck.length - 1 ? "回到開頭" : "下一題";
  store.set("cards_pos", {t:topicSel, f:filter, id:c.id});
}
function reveal(){ const a = $("#ans"); if(a){ a.classList.remove("hidden"); $("#revealbtn").remove(); } }
function go(d){ if(!deck.length || (d < 0 && idx === 0)) return; idx = d > 0 ? (idx + 1) % deck.length : idx - 1; haptic(); render(d); }
$("#next").onclick = () => go(1); $("#prev").onclick = () => go(-1);
document.addEventListener("keydown", e => {
  if($("#app").classList.contains("hidden") || $(".sheetbg") || curView !== "cards") return;
  if(e.key === "ArrowRight") go(1); else if(e.key === "ArrowLeft") go(-1);
  else if(e.key === " "){ e.preventDefault(); if($("#ans")) reveal(); else go(1); }
});
let sx = 0, sy = 0;
$("#cardhost").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("#cardhost").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1); }, {passive:true});

/* ===== 面板 ===== */
function openSheet(title, html, after){
  closeSheet();
  const bg = document.createElement("div"); bg.className = "sheetbg";
  bg.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sheethd"><b>${title}</b><button class="navbtn press" id="sheetdone">完成</button></div><div class="sheetbd">${html}</div></div>`;
  document.body.appendChild(bg);
  bg.onclick = e => { if(e.target === bg) closeSheet(); };
  $("#sheetdone").onclick = closeSheet;
  if(after) after(bg);
}
function closeSheet(){ const s = $(".sheetbg"); if(s) s.remove(); }
$("#tocbtn").onclick = () => {
  openSheet(`目錄・${deck.length} 題`, `<div class="group">` + deck.map((c, i) =>
    `<button class="tocrow${i === idx ? " cur" : ""}" data-i="${i}"><b>${c.type === "N" ? "重點" : c.no}</b><span>${esc(c.type === "N" ? c.title : c.q)}</span></button>`).join("") + `</div>`, bg => {
    const cur = bg.querySelector(".cur"); if(cur) cur.scrollIntoView({block:"center"});
    bg.querySelectorAll(".tocrow").forEach(b => b.onclick = () => { idx = +b.dataset.i; closeSheet(); render(0); });
  });
};

/* ===== 背景 ===== */
function setBgTitle(t, sub){ $("#bgtitle").textContent = t; $("#bgnavtitle").textContent = t; $("#bgback").style.visibility = sub ? "visible" : "hidden"; }
function renderBgList(){
  bgOpen = null; setBgTitle("背景", false);
  const B = DATA.bg;
  $("#bghost").innerHTML = `<div class="gtitle">總覽</div><div class="group">
    <button class="cell press" data-k="intro"><span class="ic" style="background:#8e8e93">總</span><span class="tx">說明與共同主軸<small>五項議題的共同主軸與閱讀方式</small></span><span class="chev">›</span></button></div>
    <div class="gtitle">議題</div><div class="group">` +
    B.topics.map((t,i) => `<button class="cell press" data-k="${i}"><span class="ic" style="background:${COLORS[i]}">${CN[i]}</span><span class="tx">${esc(t.title)}</span><span class="chev">›</span></button>`).join("") +
    `</div><div class="gtitle">附錄</div><div class="group"><button class="cell press" data-k="gloss"><span class="ic" style="background:#5ac8fa">詞</span><span class="tx">名詞對照</span><span class="chev">›</span></button></div>
    <p class="foot">資料截至 ${esc(B.date)}，均為公開來源，各議題文末附來源。</p>`;
  $("#bghost").querySelectorAll(".cell").forEach(c => c.onclick = () => openBg(c.dataset.k));
  $("#v-bg").scrollTo({top:0});
}
function wrapTables(html){ return html.replace(/<table class=['"]t['"]>/g, "<div class='tblwrap'><table>").replace(/<\/table>/g, "</table></div>"); }
function openBg(k){
  const B = DATA.bg; bgOpen = k; let title, h;
  if(k === "intro"){ title = "共同主軸"; h = `<div class="article">${B.intro}${wrapTables(B.cross)}</div>`; }
  else if(k === "gloss"){ title = "名詞對照"; h = `<div class="article"><div class="tblwrap"><table class="gloss"><tr><th>中文</th><th>原文</th><th>英文</th></tr>` +
      B.glossary.map(g => `<tr><td>${esc(g[0])}</td><td lang="ja">${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join("") + `</table></div></div>`; }
  else{
    const t = B.topics[+k]; title = t.short;
    h = `<div class="keybox"><b>本題重點</b>${esc(t.key)}</div><div class="article">${wrapTables(t.html)}</div>
      <div class="gtitle">來源（${t.sources.length}）</div><div class="group srcs">` +
      t.sources.map(s => `<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}<small>${esc(s[1])}</small></a>`).join("") + `</div><div style="height:16px"></div>`;
  }
  setBgTitle(title, true);
  $("#bghost").innerHTML = h;
  $("#v-bg").scrollTo({top:0});
}
$("#bgback").onclick = renderBgList;

/* ===== 設定 ===== */
function renderSettings(){
  $("#sethost").innerHTML = `<div class="gtitle">閱讀</div><div class="group">
      <button class="cell press" id="s-hide"><span class="tx">預設遮住擬答<small>只顯示問題，點一下才看答案，適合演練</small></span><span class="switch${hideAns ? " on" : ""}"></span></button>
      <button class="cell press" id="s-stars"><span class="tx">已標記提問</span><span class="val">${stars.size} 題</span><span class="chev">›</span></button>
    </div>
    <div class="gtitle">版本</div><div class="group">
      <div class="cell"><span class="tx">目前版本</span><span class="val">v${APP_VERSION}</span></div>
      <button class="cell press" id="s-hist"><span class="tx">更新紀錄</span><span class="chev">›</span></button>
      <button class="cell press link" id="s-chk"><span class="tx">檢查更新</span></button>
    </div>
    <div class="gtitle">安全</div><div class="group">
      <button class="cell press" id="s-clear"><span class="tx">清除標記與閱讀進度</span></button>
      <button class="cell danger press" id="s-lock">立即鎖定</button>
    </div>
    <p class="foot">內容以密碼加密，密碼不會儲存在本機。離開前建議按「立即鎖定」。</p>`;
  $("#s-hide").onclick = () => { hideAns = !hideAns; store.set("cards_hide", hideAns); syncHideBtn(); render(0); renderSettings(); };
  $("#s-stars").onclick = () => { filter = "star"; syncFilters(); build(); render(0); showView("cards"); };
  $("#s-hist").onclick = showHistory;
  $("#s-chk").onclick = () => checkUpdate(true);
  $("#s-clear").onclick = () => { if(confirm("確定清除所有標記與閱讀進度？")){ stars = new Set(); store.set("cards_stars", []); store.set("cards_pos", null); build(); render(0); renderSettings(); toast("已清除"); } };
  $("#s-lock").onclick = lockApp;
}

/* ===== 版本控制 ===== */
function cmpVer(a, b){ const x = a.split(".").map(Number), y = b.split(".").map(Number); for(let i=0;i<3;i++){ if((x[i]||0) !== (y[i]||0)) return (x[i]||0) - (y[i]||0); } return 0; }
$("#lockver").textContent = "版本 v" + APP_VERSION;
async function checkUpdate(manual){
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw 0;
    const remote = await r.json();
    if(cmpVer(remote.version, APP_VERSION) > 0){
      $("#updtitle").textContent = `有新版本 v${remote.version}`;
      $("#updtxt").textContent = remote.history && remote.history[0] ? remote.history[0].notes.join("、") : "";
      $("#updbar").classList.remove("hidden");
    }else if(manual) toast("目前已是最新版本 v" + APP_VERSION);
  }catch(e){ if(manual) toast(navigator.onLine ? "無法檢查更新，請稍後再試" : "目前離線，無法檢查更新"); }
}
$("#updbtn").onclick = async () => {
  $("#updtitle").textContent = "更新中…"; $("#updtxt").textContent = "";
  try{ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(reg) await reg.update();
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } }catch(e){}
  location.reload();
};
function showHistory(){
  openSheet("更新紀錄", `<div class="group">` + HISTORY.map(h => `<div class="hist"><div class="h">v${h.version}<span>${h.date}</span>${h.version === APP_VERSION ? "<em>目前</em>" : ""}</div><ul>${h.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("") + `</div>`);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) checkUpdate(false); });
checkUpdate(false);
if("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
